name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Minimal GITHUB_TOKEN permissions for all jobs
permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (src + tests)
        run: ruff check src/ tests/

  mql5-structure:
    name: Validate MQL5 file structure
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required MQL5 files exist
        run: |
          echo "Checking required MQL5 source files..."
          files=(
            "MQL5/Experts/LoadBalancer/LoadBalancerMaster.mq5"
            "MQL5/Experts/LoadBalancer/LoadBalancerSlave.mq5"
            "MQL5/Include/LoadBalancer/Config.mqh"
            "MQL5/Include/LoadBalancer/TradeSignal.mqh"
            "MQL5/Include/LoadBalancer/PositionSync.mqh"
            "MQL5/Include/LoadBalancer/Notifications.mqh"
          )
          for f in "${files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "MISSING: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Check MQL5 files are non-empty
        run: |
          for f in MQL5/Experts/LoadBalancer/*.mq5 MQL5/Include/LoadBalancer/*.mqh; do
            if [[ ! -s "$f" ]]; then
              echo "EMPTY FILE: $f"
              exit 1
            fi
            echo "OK (non-empty): $f"
          done

      - name: Check MQL5 files include required headers
        run: |
          echo "Checking LoadBalancerMaster.mq5 includes..."
          grep -q '#include <LoadBalancer/Config.mqh>'        MQL5/Experts/LoadBalancer/LoadBalancerMaster.mq5
          grep -q '#include <LoadBalancer/TradeSignal.mqh>'   MQL5/Experts/LoadBalancer/LoadBalancerMaster.mq5
          grep -q '#include <LoadBalancer/PositionSync.mqh>'  MQL5/Experts/LoadBalancer/LoadBalancerMaster.mq5
          echo "Checking LoadBalancerSlave.mq5 includes..."
          grep -q '#include <LoadBalancer/Config.mqh>'        MQL5/Experts/LoadBalancer/LoadBalancerSlave.mq5
          grep -q '#include <LoadBalancer/TradeSignal.mqh>'   MQL5/Experts/LoadBalancer/LoadBalancerSlave.mq5
          grep -q '#include <LoadBalancer/PositionSync.mqh>'  MQL5/Experts/LoadBalancer/LoadBalancerSlave.mq5
          echo "All include checks passed."

      - name: Verify .gitignore excludes runtime artifacts
        run: |
          grep -q '*.ex5'          .gitignore
          grep -q 'signals/*.json' .gitignore
          echo ".gitignore OK"
